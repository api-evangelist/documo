description: Documo (mFax) is a cloud fax and document delivery platform. The Documo
  REST API lets developers send and receive faxes, provision and manage fax numbers,
  subscribe to delivery events via webhooks, and manage account resources over a
  JSON/HTTPS interface secured with an API key.
