aid: documo
url: https://raw.githubusercontent.com/api-evangelist/documo/refs/heads/main/apis.yml
name: Documo
kind: company
description: Documo (mFax) is a cloud fax and document delivery platform. The Documo
  REST API lets developers send and receive faxes, provision and manage fax numbers,
  subscribe to delivery events via webhooks, and manage account resources over a
  JSON/HTTPS interface secured with an API key.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Fax
- Cloud Fax
- Document Delivery
- HIPAA
- Communications
created: '2026-06-21'
modified: '2026-06-21'
specificationVersion: '0.19'
apis:
- aid: documo:fax
  name: Documo Fax API
  tags:
  - Fax
  - Send
  - Receive
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.documo.com/
  baseURL: https://api.documo.com/v1
  properties:
  - url: https://docs.documo.com/
    type: Documentation
  - url: https://docs.documo.com/#send-a-fax
    type: APIReference
  - url: openapi/documo-openapi.yml
    type: OpenAPI
  - url: collections/documo.postman_collection.json
    type: Postman
  description: Send a fax to one or more recipients with cover page, scheduling, tags,
    and custom fields; resend a previously failed fax; retrieve fax detail and status;
    list fax history; and download delivered fax documents as PDF or TIFF.
- aid: documo:numbers
  name: Documo Numbers API
  tags:
  - Numbers
  - Provisioning
  - DID
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.documo.com/
  baseURL: https://api.documo.com/v1
  properties:
  - url: https://docs.documo.com/
    type: Documentation
  - url: openapi/documo-openapi.yml
    type: OpenAPI
  - url: collections/documo.postman_collection.json
    type: Postman
  description: Search available inbound fax numbers, provision (add) numbers to an
    account, list provisioned numbers, and release numbers no longer needed.
- aid: documo:webhooks
  name: Documo Webhooks API
  tags:
  - Webhooks
  - Events
  - Notifications
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.documo.com/#create-webhook
  baseURL: https://api.documo.com/v1
  properties:
  - url: https://docs.documo.com/#create-webhook
    type: Documentation
  - url: openapi/documo-openapi.yml
    type: OpenAPI
  - url: collections/documo.postman_collection.json
    type: Postman
  description: Create, list, and delete webhook subscriptions at the account or number
    level to receive inbound/outbound fax succeed and failed events plus number add
    and release events.
- aid: documo:account
  name: Documo Account API
  tags:
  - Account
  - Settings
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.documo.com/
  baseURL: https://api.documo.com/v1
  properties:
  - url: https://docs.documo.com/
    type: Documentation
  - url: openapi/documo-openapi.yml
    type: OpenAPI
  - url: collections/documo.postman_collection.json
    type: Postman
  description: Retrieve account profile and settings information. API keys carry an
    admin or user access level that governs which endpoints they can call.
