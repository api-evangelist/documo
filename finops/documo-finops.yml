description: >-
  FinOps view of Documo (mFax) spend. Documo bills a recurring monthly
  subscription per plan that bundles a page allotment, then charges per-page
  overage above the allotment. Additional users and numbers are flat monthly
  add-ons, and Intelligent Document Processing (IDP) is billed separately per
  document. Cost optimization centers on matching plan tier to monthly page
  volume and minimizing overage.
notes: >-
  Per-plan page allotments, overage rates, and IDP per-document pricing are
  subject to change; verify against the Documo pricing page during
  reconciliation. Marked reconciled false.
