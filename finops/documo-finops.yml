meters:
- name: plan_subscription
  description: Recurring monthly plan fee that bundles a page allotment.
  unit: months
  aggregation: sum
  dimensions:
  - account
  - plan
- name: page_overage
  description: Pages sent or received above the plan allotment, billed per page.
  unit: pages
  aggregation: sum
  dimensions:
  - account
  - number
- name: additional_users
  description: Extra user seats beyond those included in the plan, billed per user per month.
  unit: users
  aggregation: sum
  dimensions:
  - account
- name: additional_numbers
  description: Extra inbound fax numbers beyond those included, billed per number per month.
  unit: numbers
  aggregation: sum
  dimensions:
  - account
- name: idp_documents
  description: Documents processed via Intelligent Document Processing, billed per document.
  unit: documents
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Pull Documo fax history and reports; track monthly page volume per number against the plan allotment.
- name: Allocation
  description: Tag numbers and API keys per client or workload; in multi-tenant setups use separate Documo accounts per client for accurate reporting.
- name: Optimization
  description: Right-size the plan tier to typical monthly page volume to avoid $0.15 per-page overage; remove unused users and numbers; reserve IDP for documents that need extraction.
- name: Accountability
  description: Assign an owner per account/plan; review page burn and overage monthly against budget.
